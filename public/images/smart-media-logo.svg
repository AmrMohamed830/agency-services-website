<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" fill="none" className="w-full h-full">
  <defs>
    <!-- Cyan to Neon Purple Gradient -->
    <linearGradient id="smBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Subtle Glow Filter for Tech Accent -->
    <filter id="smGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- === SM Monogram with Circuit Integration === -->
  <g transform="translate(10, 15)">
    <!-- Circuit Connection Dots & Traces -->
    <circle cx="58" cy="45" r="7" fill="#00D2FF" />
    <path d="M 58 45 L 95 45 L 115 65" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="115" cy="65" r="7" fill="#3B82F6" />

    <!-- S shape -->
    <path d="M 125 35 
             H 48 
             C 30 35 15 48 15 68 
             C 15 88 30 98 52 100 
             L 105 105 
             C 125 107 138 118 138 135 
             C 138 154 120 165 95 165 
             H 15" 
          stroke="url(#smBrandGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Arrow head on bottom of S -->
    <path d="M 65 148 L 85 165 L 65 182" fill="none" stroke="url(#smBrandGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- M shape -->
    <path d="M 128 165 
             L 172 35 
             L 218 115 
             L 262 35 
             L 305 165" 
          stroke="url(#smBrandGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Circuit Nodes under M -->
    <circle cx="218" cy="115" r="7" fill="#8B5CF6" />
    <path d="M 218 115 L 195 145" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" />
    <circle cx="195" cy="145" r="7" fill="#8B5CF6" />
    <path d="M 218 115 L 218 155" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" />
    <circle cx="218" cy="155" r="7" fill="#A855F7" />
    <path d="M 218 115 L 245 142" stroke="#A855F7" stroke-width="5" stroke-linecap="round" />
    <circle cx="245" cy="142" r="7" fill="#C084FC" />
  </g>

  <!-- === SMART MEDIA Typography === -->
  <g transform="translate(355, 30)">
    <!-- SMART -->
    <text x="0" y="55" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" letter-spacing="4">
      SMART
    </text>

    <!-- MEDIA -->
    <text x="0" y="125" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" letter-spacing="4">
      ME
    </text>

    <!-- D with Play Triangle Inside -->
    <g transform="translate(92, 75)">
      <!-- D outline -->
      <path d="M 0 5 H 18 C 36 5 48 18 48 34 C 48 50 36 63 18 63 H 0 V 5 Z" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round" />
      <!-- Play button in D -->
      <polygon points="16,22 34,34 16,46" fill="#FFFFFF" />
    </g>

    <text x="155" y="125" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" letter-spacing="4">
      IA
    </text>
  </g>
</svg>
